name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # A release created with GITHUB_TOKEN does not emit the `release: published`
      # event (GitHub blocks recursive workflow triggers), so publish.yml never
      # fired on its own. A workflow_dispatch via the API does work.
      - name: Trigger package publish
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref "${{ steps.release.outputs.tag_name }}"
