name: Deploy Playbooks to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build CSS bundle
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Checkout legacy line (0.9) for versioned CSS
        uses: actions/checkout@v7
        with:
          ref: legacy/2026
          path: legacy

      - name: Build legacy CSS bundle
        working-directory: legacy
        run: npm ci && npm run build

      - name: Build site
        run: |
          mkdir -p _site/playbooks _site/v1 _site/v0.9
          # Playbooks for the current line
          cp src/playbooks/*.html _site/playbooks/
          cp -r src/tokens src/css src/fonts _site/
          # Versioned bundles — consumers pin one of these
          cp -r dist/. _site/v1/
          cp -r legacy/dist/. _site/v0.9/
          # Unversioned /dist/ keeps serving 0.9 until every consumer has pinned (c123-xml-tools#7)
          cp -r legacy/dist _site/dist
          echo '<meta http-equiv="refresh" content="0;url=playbooks/">' > _site/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
